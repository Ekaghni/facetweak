[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "facetweak"
version = "0.1.2"
description = "Face retouching from the command line or Python: bigger eyes, slimmer face, nose and lip tweaks with smooth landmark-guided warps. Runs on CPU."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Ekaghni", email = "ekaghni.mukherjee@gmail.com" }]
keywords = ["face retouch", "face editing", "face landmarks", "face slimming", "eye enlargement", "photo retouching", "image warping", "mediapipe", "opencv", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = ["numpy", "opencv-python>=4.5", "mediapipe>=0.10"]

[project.optional-dependencies]
dlib = ["dlib"]
dev = ["pytest", "build", "twine"]

[project.scripts]
facetweak = "facetweak.cli:main"

[project.urls]
Homepage = "https://github.com/Ekaghni/facetweak"
Issues = "https://github.com/Ekaghni/facetweak/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: loads a landmark model and runs detection"]
